version: '3.8'

services:
  # Kafka 브로커 서비스 정의 (단일 인스턴스)
  kafka-broker:
    image: apache/kafka:latest
    hostname: kafka-broker # 컨테이너 내부 호스트명 설정
    container_name: kafka-broker
    ports:
      - "9092:9092" # 외부 포트:컨테이너 내부 포트 (클라이언트 통신용)
      - "9093:9093" # 외부 포트:컨테이너 내부 포트 (컨트롤러 내부 통신용)
    environment:
      # KRaft 모드 클러스터 ID (테스트용 UUID)
      KAFKA_CLUSTER_ID: "6967c70b-33d8-460c-a34c-934b0177bffc" 
      KAFKA_BROKER_ID: 1
      KAFKA_NODE_ID: 1
      
      # 리스너 설정: PLAINTEXT (클라이언트용), CONTROLLER (내부 통신용) 두 개 정의
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      
      # 외부에 노출되는 리스너 주소 (로컬PC에서 localhost로 접속 가능)
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      
      # 브로커 겸 컨트롤러 역할 수행
      KAFKA_PROCESS_ROLES: broker,controller
      
      # 컨트롤러 쿼럼 설정 (자신의 9093 포트를 바라보도록 설정)
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-broker:9093
      
      # 컨트롤러 역할에 사용할 리스너 이름 지정 (LISTENERS에 정의된 CONTROLLER 사용)
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      
    volumes:
      # 데이터 영속성을 위한 로컬 볼륨 마운트
      - ./kafka_data:/var/lib/kafka/data
    restart: unless-stopped

      # --- Kafka UI 서비스 (새로 추가) ---
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8090:8080" # 웹 UI 접속 포트 (http://localhost:8080)
    environment:
      # Kafka 브로커 접속 주소 지정 (컨테이너 내부 호스트명 'kafka-broker' 사용)
      KAFKA_CLUSTERS_0_NAME: local-kafka-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: 172.30.32.224:9092 #임시, 추후 변경 필요
      # Topic 생성을 활성화 (선택 사항)
      KAFKA_CLUSTERS_0_TOPIC_CREATION_ENABLED: "true"
    depends_on:
      - kafka-broker
    restart: unless-stopped
